<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skywriting Heart - Dynamic Canvas Animation</title>
  <meta name="description" content="A full-screen dynamic HTML5 Canvas animation of an airplane skywriting a heart shape across a vibrant blue sky with realistic puffy smoke trails and distant birds.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Canvas container for full-screen rendering -->
  <div id="canvas-container">
    <canvas id="sky-canvas"></canvas>
  </div>

  <!-- UI Overlay for controls and aesthetic info -->
  <header class="hud-header">
    <div class="hud-badge">
      <span class="pulse-dot"></span>
      <span class="hud-title">Acrobatic Skywriting</span>
      <span class="hud-divider">|</span>
      <span id="flight-status" class="hud-status">Entering Airspace...</span>
    </div>
  </header>

  <!-- Interactive Controls Bar -->
  <footer class="hud-controls">
    <div class="control-panel glassmorphism">
      <button id="btn-replay" class="control-btn" title="Replay Animation">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 4v6h6M23 20v-6h-6"/>
          <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
        </svg>
        <span>Replay</span>
      </button>

      <button id="btn-pause" class="control-btn" title="Pause / Resume">
        <svg id="pause-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="6" y="4" width="4" height="16" rx="1"/>
          <rect x="14" y="4" width="4" height="16" rx="1"/>
        </svg>
        <span id="pause-label">Pause</span>
      </button>

      <button id="btn-sound" class="control-btn" title="Toggle Propeller Audio">
        <svg id="sound-icon-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M11 5L6 9H2v6h4l5 4V5z"/>
          <line x1="23" y1="9" x2="17" y2="15"/>
          <line x1="17" y1="9" x2="23" y2="15"/>
        </svg>
        <svg id="sound-icon-on" class="hidden" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M11 5L6 9H2v6h4l5 4V5z"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
        </svg>
        <span id="sound-label">Audio: Off</span>
      </button>

      <div class="control-group">
        <label for="speed-slider" class="control-label">Speed</label>
        <input type="range" id="speed-slider" min="0.5" max="2.0" step="0.1" value="1.0" aria-label="Flight Speed">
        <span id="speed-val" class="slider-val">1.0x</span>
      </div>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
